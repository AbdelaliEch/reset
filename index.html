<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080f">
<title>Abdelali's Reset</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#08080f;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:480px;margin:0 auto;padding:14px 12px 40px;min-height:100vh}
.hdr{text-align:center;margin-bottom:18px}
.hdr h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.hdr p{font-size:11px;color:#556;margin-top:3px;font-family:monospace}
.streaks{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.sb{text-align:center;padding:10px 14px;border-radius:12px;min-width:75px}
.sb .n{font-family:monospace;font-size:26px;font-weight:800;line-height:1}
.sb .l{font-size:9px;opacity:.55;margin-top:3px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.wr{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.wr .ar{background:none;border:1px solid #ffffff12;border-radius:8px;color:#778;cursor:pointer;padding:5px 9px;font-size:13px}
.wd{display:flex;gap:3px;flex:1;justify-content:center}
.db{flex:1;min-width:42px;max-width:54px;padding:7px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;background:#0b0b16;border:1px solid #ffffff0a}
.db.sel{border:2px solid #818cf8;background:#818cf812}
.db.td{border:2px solid #818cf835}
.db .dn{font-size:9.5px;font-weight:700;text-transform:uppercase;color:#556}
.db.sel .dn{color:#818cf8}
.db .dd{font-size:15px;font-weight:700;font-family:monospace;color:#889}
.db.sel .dd{color:#e8ecf2}
.db .br{width:75%;height:3px;background:#ffffff0a;border-radius:2px;overflow:hidden}
.db .bf{height:100%;border-radius:2px}
.dl{text-align:center;margin-bottom:14px}
.dl .nm{font-size:15px;font-weight:700}
.dl .dt{font-size:12px;color:#556;margin-left:7px;font-family:monospace}
.tabs{display:flex;gap:3px;margin-bottom:14px;background:#0b0b16;border-radius:11px;padding:3px}
.tabs button{flex:1;padding:7px 6px;border-radius:9px;border:none;font-size:11.5px;font-weight:700;cursor:pointer;background:transparent;color:#556}
.tabs button.on{background:#818cf818;color:#818cf8}
.pl{border-radius:18px;padding:18px 16px 14px;margin-bottom:14px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pt{display:flex;align-items:center;gap:8px}
.pt .ic{font-size:20px}
.pt .nm{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.ps{display:flex;align-items:center;gap:8px}
.ps .ct{font-size:12px;opacity:.75;font-family:monospace}
.ps .pb{width:52px;height:5px;border-radius:3px;overflow:hidden}
.ps .pf{height:100%;border-radius:3px;transition:width .3s}
.tk{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;margin-bottom:2px;cursor:pointer;user-select:none;-webkit-user-select:none}
.cb{width:24px;height:24px;min-width:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cb svg{display:none}
.cb.ck svg{display:block}
.tl{flex:1;font-size:13.5px;font-weight:500;color:#dde4ee;transition:all .15s}
.tk.dn .tl{text-decoration:line-through;opacity:.65}
.tt{font-size:10.5px;font-family:monospace;white-space:nowrap;opacity:.4}
.nb{background:#0b0b16;border:1px solid #ffffff0d;border-radius:16px;padding:18px;margin-bottom:14px}
.nb .nt{font-size:13px;font-weight:800;color:#778;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.nb textarea{width:100%;min-height:75px;padding:11px;border-radius:10px;border:1px solid #ffffff0d;background:#08080f;color:#c8d0dd;font-size:12.5px;resize:vertical;outline:none;font-family:inherit}
.sc{background:#0a0a14;border:1px solid #ffffff0d;border-radius:16px;padding:18px;margin-bottom:14px}
.sc .st{font-size:13px;font-weight:800;color:#778;margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em}
.si{display:flex;gap:10px;padding:4px 0}
.si .tm{font-family:monospace;font-size:11.5px;opacity:.65;min-width:46px;text-align:right}
.si .ln{width:2px;min-height:16px;border-radius:1px;opacity:.25}
.si .ac{font-size:12.5px;color:#c8d0dd;font-weight:500}
.gc{background:#0a1620;border:1px solid #38bdf825;border-radius:16px;padding:18px;margin-bottom:14px}
.gc .gt{font-size:13px;font-weight:800;color:#38bdf8;margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em}
.ge{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:#38bdf806;border-radius:8px;margin-bottom:4px}
.ge .en{font-size:13.5px;font-weight:600;color:#e2e8f0}
.ge .ed{font-size:10.5px;color:#38bdf8;opacity:.55}
.ge .es{font-size:10.5px;color:#38bdf8;font-family:monospace;white-space:nowrap}
.hc{border-radius:16px;padding:18px;margin-bottom:14px}
.hc .ht{font-size:13px;font-weight:800;margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.hc .hi{font-size:12.5px;line-height:1.7;font-weight:500}
.vd{margin-top:20px;border-top:1px solid #ffffff08;padding-top:18px}
.vd .vt{text-align:center;font-size:16px;font-weight:800;letter-spacing:.02em;margin-bottom:6px}
.vd .vs{text-align:center;font-size:12.5px;color:#99a;line-height:1.6;padding:0 8px}
.co{font-size:11.5px;padding:8px 12px;border-radius:10px;font-weight:600;margin-top:4px;border-left:3px solid}
</style>
</head>
<body>
<div class="hdr"><h1>ABDELALI'S RESET</h1><p>Physical · Deen · Mental — Every Day</p></div>
<div class="streaks" id="streaks"></div>
<div class="wr"><button class="ar" onclick="sw(-1)">&lsaquo;</button><div class="wd" id="wd"></div><button class="ar" onclick="sw(1)">&rsaquo;</button></div>
<div class="dl" id="dl"></div>
<div class="tabs" id="tabs"></div>
<div id="ct"></div>
<div class="vd" id="vd"></div>
<script>
const D=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],S=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fm=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const ps=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const td=()=>fm(new Date()),dw=s=>ps(s).getDay();
let sel=td(),tab="check",ad={},sk={cur:0,best:0,last:null};

const lg=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

// SWIM DAYS: Sat(6), Mon(1), Wed(3), Fri(5) — 4x/week
// OFF DAYS: Sun(0), Tue(2), Thu(4) — light walk + bodyweight only
function gt(ds){
  const d=dw(ds),t={deen:[],physical:[],mental:[],work:[]};
  // DEEN — unchanged, this travels with you
  t.deen.push({id:"fajr",label:"Salat Al-Fajr — صلاة الفجر",time:"~5:45"});
  t.deen.push({id:"quran",label:"Quran — صفحة واحدة بعد الفجر",time:"~6:10"});
  t.deen.push({id:"dhuhr",label:"Salat Adh-Dhuhr — صلاة الظهر",time:"~13:40"});
  t.deen.push({id:"asr",label:"Salat Al-Asr — صلاة العصر",time:"~17:00"});
  t.deen.push({id:"maghrib",label:"Salat Al-Maghrib — صلاة المغرب",time:"~19:50"});
  t.deen.push({id:"isha",label:"Salat Al-Isha — صلاة العشاء",time:"~21:10"});
  t.deen.push({id:"adhkar",label:"Adhkar — post-prayer + walking to/from mosque",time:"throughout day"});
  t.deen.push({id:"adhkar_sleep",label:"Pre-sleep: Ikhlas + Falaq + Nas ×3",time:"~23:30"});
  // PHYSICAL — Agadir version
  t.physical.push({id:"breakfast",label:"Breakfast you cook (eggs + oats + fruit)",time:"~8:00"});
  t.physical.push({id:"lunch_portion",label:"Lunch with family — normal portion, no seconds",time:"~12:30"});
  t.physical.push({id:"dinner_portion",label:"Dinner with family — normal portion",time:"~22:45"});
  t.physical.push({id:"refuse_junk",label:"Refused afternoon junk food",time:""});
  t.physical.push({id:"water",label:"2L+ water",time:""});
  // WORKOUT SCHEDULE:
  // Mon(1)/Wed(3)/Fri(5) = Gym (Full Body) at 17:30
  // Tue(2)/Sat(6) = Swim morning at 8:30 (safety: beach populated)
  // Thu(4) = Active recovery (just the daily walk, no extra)
  // Sun(0) = Full rest
  if(d===1||d===3||d===5){
    t.physical.push({id:"workout",label:"GYM — Full Body (45-60 min)",time:"~17:30"});
  }else if(d===2||d===6){
    t.physical.push({id:"workout",label:"SWIM — morning with fins (30-45 min)",time:"~8:30"});
  }else if(d===4){
    t.physical.push({id:"workout",label:"Active recovery — light stretch + walk",time:"~17:30"});
  }
  // d===0 (Sunday) = no workout checkbox at all, full rest
  t.physical.push({id:"daily_walk",label:"Post-workout LISS walk (20-30 min)",time:"~18:35"});
  // DISCIPLINE — Agadir version (no airplane mode ritual)
  t.mental.push({id:"no_pmo",label:"Clean day (no PMO)",time:""});
  t.mental.push({id:"no_binge",label:"No emotional eating / snacking",time:""});
  t.mental.push({id:"no_phone_wc",label:"No phone in bathroom",time:""});
  t.mental.push({id:"no_phone_bed",label:"Phone not in bed (left on desk)",time:""});
  t.mental.push({id:"wake_fajr",label:"Woke up for Fajr (no snooze)",time:"5:40"});
  t.mental.push({id:"nap_end",label:"Post-Fajr nap ended by 8:00 (no slide)",time:"8:00"});
  t.mental.push({id:"no_scroll_fajr",label:"No phone until Quran done",time:""});
  t.mental.push({id:"screen_limit",label:"Phone entertainment < 1 hour",time:""});
  t.mental.push({id:"browsers_off",label:"Browsers: tracker + study only",time:""});
  // WORK — Agadir = more time, more blocks
  t.work.push({id:"leetcode",label:"LeetCode — 30min solve + 30min NeetCode",time:"8:30-9:30"});
  t.work.push({id:"work_am",label:"Work block 1 — deep work (3h)",time:"9:30-12:30"});
  t.work.push({id:"work_pm",label:"Work block 2 — deep work (3h)",time:"14:00-17:00"});
  t.work.push({id:"work_eve",label:"Work block 3 — evening session (2h)",time:"20:00-22:00"});
  return t;
}

function wk(c){const d=ps(c),w=d.getDay(),m=new Date(d);m.setDate(d.getDate()-((w+6)%7));return Array.from({length:7},(_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return fm(x)})}

function ld(){sk=lg("sk")||{cur:0,best:0,last:null};ad={};wk(sel).forEach(d=>{ad[d]=lg("d:"+d)||{}})}

function tg(id){
  const c=ad[sel]||{};c[id]=!c[id];ad[sel]=c;sv("d:"+sel,c);
  if(id==="no_pmo"){
    if(c.no_pmo){if(!sk.last)sk.cur=1;else{const df=Math.round((ps(sel)-ps(sk.last))/864e5);sk.cur=df===1?sk.cur+1:1}sk.last=sel;sk.best=Math.max(sk.best,sk.cur)}else sk.cur=0;
    sv("sk",sk);
  }
  rn();
}

function sw(dir){const d=ps(sel);d.setDate(d.getDate()+dir*7);sel=fm(d);ld();rn()}
function sd(d){sel=d;ld();rn()}
function st(t){tab=t;rn()}
function sn(){const v=document.getElementById("na");if(v)sv("n:"+sel,v.value)}

function rn(){
  const ts=gt(sel),ck=ad[sel]||{},all=[...ts.deen,...ts.physical,...ts.mental,...ts.work];
  const dn=all.filter(t=>ck[t.id]).length,pct=all.length?Math.round(dn/all.length*100):0;
  const nm=D[dw(sel)];

  document.getElementById("streaks").innerHTML=[
    {v:sk.cur,l:"Clean Streak",c:"#818cf8"},{v:sk.best,l:"Best Streak",c:"#4ade80"},
    {v:pct+"%",l:"Today",c:pct===100?"#4ade80":pct>50?"#fbbf24":"#f87171"}
  ].map(b=>'<div class="sb" style="background:'+b.c+'0d;border:1px solid '+b.c+'20"><div class="n" style="color:'+b.c+'">'+b.v+'</div><div class="l" style="color:'+b.c+'">'+b.l+'</div></div>').join("");

  const t2=td(),wks=wk(sel);
  document.getElementById("wd").innerHTML=wks.map(date=>{
    const s2=date===sel,it=date===t2,dd=ad[date]||{},tk=gt(date);
    const a2=[...tk.deen,...tk.physical,...tk.mental,...tk.work],d2=a2.filter(t=>dd[t.id]).length,p2=a2.length?Math.round(d2/a2.length*100):0;
    const cl="db"+(s2?" sel":"")+(it&&!s2?" td":"");
    const bc=p2===100?"#4ade80":p2>50?"#818cf8":p2>0?"#f87171":"transparent";
    return '<div class="'+cl+'" onclick="sd(\''+date+'\')"><span class="dn">'+S[dw(date)]+'</span><span class="dd">'+ps(date).getDate()+'</span><div class="br"><div class="bf" style="width:'+p2+'%;background:'+bc+'"></div></div></div>';
  }).join("");

  document.getElementById("dl").innerHTML='<span class="nm">'+nm+'</span><span class="dt">'+sel+'</span>';

  const tbs=[{k:"check",l:"Checklist"},{k:"sched",l:"Schedule"},{k:"workout",l:"Workout"},{k:"help",l:"Help"}];
  document.getElementById("tabs").innerHTML=tbs.map(t=>'<button class="'+(tab===t.k?"on":"")+'" onclick="st(\''+t.k+'\')">'+t.l+'</button>').join("");

  const ct=document.getElementById("ct");
  if(tab==="check"){
    ct.innerHTML=rp("deen","Deen","🕌",ts.deen,ck,"#818cf8","#111127")+rp("physical","Physical","💪",ts.physical,ck,"#4ade80","#112011")+rd(ts.mental,ck)+rp("work","Work","💻",ts.work,ck,"#fbbf24","#1f1a0f")+rnt();
  }else if(tab==="sched"){ct.innerHTML=rsc(nm)}
  else if(tab==="workout"){ct.innerHTML=rworkout()}
  else if(tab==="help"){ct.innerHTML=rhl()}
  else ct.innerHTML="";

  document.getElementById("vd").innerHTML=rvd(ts,ck,pct);
}

function rp(key,label,icon,tasks,ck,acc,bg){
  const dn=tasks.filter(t=>ck[t.id]).length,pc=tasks.length?Math.round(dn/tasks.length*100):0;
  let h='<div class="pl" style="background:'+bg+';border:1px solid '+acc+'25">';
  h+='<div class="ph"><div class="pt"><span class="ic">'+icon+'</span><span class="nm" style="color:'+acc+'">'+label+'</span></div>';
  h+='<div class="ps"><span class="ct" style="color:'+acc+'">'+dn+'/'+tasks.length+'</span><div class="pb" style="background:'+acc+'18"><div class="pf" style="width:'+pc+'%;background:'+acc+'"></div></div></div></div>';
  tasks.forEach(t=>{
    const d=!!ck[t.id];
    h+='<div class="tk'+(d?' dn':'')+'" onclick="tg(\''+t.id+'\')">';
    h+='<div class="cb'+(d?' ck':'')+'" style="border:2px solid '+(d?acc:acc+'50')+';background:'+(d?acc:'transparent')+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>';
    h+='<span class="tl" style="'+(d?'color:'+acc:'')+'">'+t.label+'</span>';
    if(t.time)h+='<span class="tt" style="color:'+acc+'">'+t.time+'</span>';
    h+='</div>';
  });
  h+='</div>';return h;
}

function rd(tasks,ck){
  const acc="#f87171",bg="#271111";
  const clean=!!ck["no_pmo"];
  const dn=tasks.filter(t=>ck[t.id]).length,pc=tasks.length?Math.round(dn/tasks.length*100):0;
  let h='<div class="pl" style="background:'+bg+';border:1px solid '+acc+'25">';
  h+='<div class="ph"><div class="pt"><span class="ic">⚔️</span><span class="nm" style="color:'+acc+'">Discipline</span></div>';
  h+='<div class="ps"><span class="ct" style="color:'+acc+'">'+dn+'/'+tasks.length+'</span><div class="pb" style="background:'+acc+'18"><div class="pf" style="width:'+pc+'%;background:'+acc+'"></div></div></div></div>';
  if(clean){
    h+='<div style="text-align:center;padding:8px;background:#10b98115;border-radius:10px;margin-bottom:10px;border:1px solid #10b98130">';
    h+='<span style="font-size:12px;font-weight:800;color:#10b981">✓ CLEAN — '+sk.cur+' day'+(sk.cur!==1?'s':'')+' streak</span>';
    if(sk.cur>=7)h+='<span style="font-size:11px;color:#10b981;opacity:.7"> — ما شاء الله</span>';
    h+='</div>';
  }else if(Object.keys(ck).length>3){
    h+='<div style="text-align:center;padding:8px;background:#ef444415;border-radius:10px;margin-bottom:10px;border:1px solid #ef444430">';
    h+='<span style="font-size:12px;font-weight:800;color:#ef4444">✗ RELAPSED — توضأ وصلِّ توبة — Don\'t spiral</span>';
    h+='</div>';
  }
  tasks.forEach(t=>{
    const d=!!ck[t.id];
    h+='<div class="tk'+(d?' dn':'')+'" onclick="tg(\''+t.id+'\')">';
    h+='<div class="cb'+(d?' ck':'')+'" style="border:2px solid '+(d?acc:acc+'50')+';background:'+(d?acc:'transparent')+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>';
    h+='<span class="tl" style="'+(d?'color:'+acc:'')+'">'+t.label+'</span>';
    if(t.time)h+='<span class="tt" style="color:'+acc+'">'+t.time+'</span>';
    h+='</div>';
  });
  h+='</div>';return h;
}

function rnt(){
  const n=lg("n:"+sel)||"";
  return '<div class="nb"><div class="nt">Daily Notes</div><textarea id="na" oninput="sn()" placeholder="Wins? Struggles? Triggers? Tomorrow\'s plan?">'+n+'</textarea></div>';
}

function rsc(nm){
  const d=D.indexOf(nm);
  const isSwim=(d===2||d===6);
  const isGym=(d===1||d===3||d===5);
  let woLabel="",woColor="#778";
  if(isGym){woLabel="GYM — Full Body (45-60 min)";woColor="#fbbf24"}
  else if(d===4){woLabel="Active recovery — light stretch only";woColor="#4ade80"}
  else if(d===0){woLabel="REST DAY — just walk";woColor="#778"}
  let s;
  if(isSwim){
    // SWIM DAY — morning swim for safety
    s=[
      {t:"5:40",a:"Wake up for Fajr",c:"#f87171"},
      {t:"5:45",a:"صلاة الفجر (mosque walk + post-prayer adhkar)",c:"#818cf8"},
      {t:"~6:00",a:"Quran — 1 page",c:"#818cf8"},
      {t:"6:30",a:"Back to sleep (alarm 8:00 SHARP)",c:"#778"},
      {t:"8:00",a:"WAKE — no slide",c:"#f87171"},
      {t:"8:00",a:"Light pre-swim snack (banana/dates only)",c:"#4ade80"},
      {t:"8:15",a:"Trottinette to beach",c:"#4ade80"},
      {t:"8:30",a:"SWIM with fins (30-45 min, beach safe = populated)",c:"#38bdf8"},
      {t:"9:15",a:"Trottinette back + quick rinse",c:"#4ade80"},
      {t:"9:30",a:"Real breakfast (eggs + oats + fruit)",c:"#4ade80"},
      {t:"10:00",a:"WORK BLOCK 1 — deep work (2.5h)",c:"#fbbf24"},
      {t:"12:30",a:"Family lunch (normal portion)",c:"#4ade80"},
      {t:"~13:40",a:"صلاة الظهر (mosque walk + post-prayer adhkar)",c:"#818cf8"},
      {t:"14:00",a:"WORK BLOCK 2 — continue (3h)",c:"#fbbf24"},
      {t:"~17:00",a:"صلاة العصر (mosque walk + post-prayer adhkar)",c:"#818cf8"},
      {t:"17:30",a:"LeetCode (1h, moved from morning)",c:"#fbbf24"},
      {t:"18:30",a:"Post-LeetCode walk — 30 min LISS",c:"#4ade80"},
      {t:"19:00",a:"Shower",c:"#778"},
      {t:"~19:50",a:"صلاة المغرب (mosque walk + post-prayer adhkar)",c:"#818cf8"},
      {t:"20:00",a:"WORK BLOCK 3 — evening session (2h)",c:"#fbbf24"},
      {t:"~21:10",a:"صلاة العشاء (mosque walk + post-prayer adhkar)",c:"#818cf8"},
      {t:"22:30",a:"Family dinner (normal portion)",c:"#4ade80"},
      {t:"23:30",a:"Pre-sleep: Ikhlas + Falaq + Nas ×3",c:"#818cf8"},
      {t:"00:00",a:"Sleep (phone on desk, not in bed)",c:"#f87171"},
    ];
  }else{
    // GYM DAY / REST DAY / RECOVERY DAY — standard morning, workout in afternoon
    s=[
      {t:"5:40",a:"Wake up for Fajr",c:"#f87171"},
      {t:"5:45",a:"صلاة الفجر (mosque walk + post-prayer adhkar)",c:"#818cf8"},
      {t:"~6:00",a:"Quran — 1 page",c:"#818cf8"},
      {t:"6:30",a:"Back to sleep (alarm 8:00 SHARP)",c:"#778"},
      {t:"8:00",a:"WAKE — no slide, no snooze",c:"#f87171"},
      {t:"8:00",a:"Cook breakfast: eggs + oats + fruit",c:"#4ade80"},
      {t:"8:30",a:"LeetCode: 30min solve + 30min NeetCode",c:"#fbbf24"},
      {t:"9:30",a:"WORK BLOCK 1 — door closed, deep work (3h)",c:"#fbbf24"},
      {t:"12:30",a:"Family lunch (normal portion)",c:"#4ade80"},
      {t:"~13:40",a:"صلاة الظهر (mosque walk + post-prayer adhkar)",c:"#818cf8"},
      {t:"14:00",a:"WORK BLOCK 2 — continue (3h)",c:"#fbbf24"},
      {t:"~17:00",a:"صلاة العصر (mosque walk + post-prayer adhkar)",c:"#818cf8"},
      {t:"17:25",a:"Trottinette to gym (5 min)",c:"#4ade80"},
      {t:"17:30",a:woLabel,c:woColor},
      {t:"18:30",a:"POST-WORKOUT WALK — 20-30 min (LISS)",c:"#4ade80"},
      {t:"19:00",a:"Shower",c:"#778"},
      {t:"~19:50",a:"صلاة المغرب (mosque walk + post-prayer adhkar)",c:"#818cf8"},
      {t:"20:00",a:"WORK BLOCK 3 — evening session (2h)",c:"#fbbf24"},
      {t:"~21:10",a:"صلاة العشاء (mosque walk + post-prayer adhkar)",c:"#818cf8"},
      {t:"22:30",a:"Family dinner (normal portion)",c:"#4ade80"},
      {t:"23:30",a:"Pre-sleep: Ikhlas + Falaq + Nas ×3",c:"#818cf8"},
      {t:"00:00",a:"Sleep (phone on desk, not in bed)",c:"#f87171"},
    ];
  }
  const dayLabel=isGym?"Gym Day":isSwim?"Swim Day (Morning)":d===4?"Recovery Day":"Rest Day";
  return '<div class="sc"><div class="st">'+dayLabel+' — '+nm+'</div>'+s.map(x=>'<div class="si"><span class="tm" style="color:'+x.c+'">'+x.t+'</span><div class="ln" style="background:'+x.c+'"></div><span class="ac">'+x.a+'</span></div>').join("")+'</div>';
}

  const tm=[
    {n:"Speed",d:"Brisk pace, you can talk but not sing",s:"5.5-6.5 km/h"},
    {n:"Incline",d:"More glutes/hams, no joint impact",s:"5-8%"},
    {n:"Duration",d:"Steady, no intervals, no sprints",s:"25-30 min"},
    {n:"Target HR",d:"60-70% of max (220 - age)",s:"118-138 BPM"},

  tm.forEach(x=>{h+='<div class="ge" style="background:#38bdf806"><div><div class="en">'+x.n+'</div><div class="ed" style="color:#38bdf8">'+x.d+'</div></div><span class="es" style="color:#38bdf8">'+x.s+'</span></div>'});

  h+='</div>';
  // OUTDOOR WALKING
  h+='<div class="gc" style="background:#0b1810;border-color:#4ade8025"><div class="gt" style="color:#4ade80">Outdoor Walking (Sun/Thu or Beach)</div>';
  h+='<div style="font-size:11.5px;color:#aab;line-height:1.7">';
  h+='Brisk pace = ~1.6 km in 15-20 min. Find a route with slight uphill if possible. Same target heart rate zone (110-130 BPM). Don\'t jog at 95kg — your knees will thank you in a year. Walking is sustainable forever, jogging gets you an injury in 2-3 weeks.';
  h+='</div></div>';
  // BOTTOM LINE
  h+='<div class="gc" style="background:#271111;border-color:#f8717125"><div class="gt" style="color:#f87171">The Honest Bottom Line</div>';
  h+='<div style="font-size:11.5px;color:#fca5a5;line-height:1.7">';
  h+='1. Food > Workout for fat loss. Refusing afternoon junk = #1 fat-loss action.<br><br>';

  h+='4. Target: 0.5-1 kg/week. 5kg in 2 months. Realistic, sustainable, BCG-ready by October.<br><br>';
  h+='5. Sunday is rest. Don\'t feel guilty. Recovery IS part of the program.';
  h+='</div></div>';
  return h;
}

  h+='</div>';
  h+='<div class="hc" style="background:#0b0b16;border:1px solid #ffffff0d"><div class="ht" style="color:#778">Deep Work Rules</div>';
  ["Door closed during work blocks","Phone in another room or face-down on desk","Family knows: 9:30-12:30 and 14-17 = do not disturb","If interrupted: 5 min, then back to it","No \"quick check\" of phone between Pomodoros"].forEach(r=>{h+='<div class="hi" style="color:#aab">→ '+r+'</div>'});

function rvd(ts,ck,pct){
  const mp=ts.deen.filter(t=>t.id!=="quran"&&t.id!=="adhkar"&&t.id!=="adhkar_sleep"&&!ck[t.id]).length;
  const aj=!ck["refuse_junk"]&&Object.keys(ck).length>5,rl=!ck["no_pmo"]&&Object.keys(ck).length>3;
  const wo=!ck["workout"]&&Object.keys(ck).length>5;
  const pb=!ck["no_phone_wc"]&&Object.keys(ck).length>3;
  const napFail=ck["wake_fajr"]&&!ck["nap_end"]&&Object.keys(ck).length>5;
  const dj=!ck["work_am"]&&!ck["work_pm"]&&!ck["work_eve"]&&Object.keys(ck).length>5;
  let tt="",cl="#556",sb="";
  if(pct===100){tt="يوم مثالي — PERFECT DAY";cl="#4ade80";
    sb=sk.cur>=7?sk.cur+" days clean. Work blocks crushed. ﴿فَإِنَّ مَعَ الْعُسْرِ يُسْرًا﴾ (94:6) — You're living this ayah."
      :sk.cur>=3?sk.cur+" days clean. Salawat on time, body trained, work moved forward. This is the Abdelali walking into BCG."
      :"Salawat ✓. Body trained ✓. Work moved forward ✓. One day closer. اللهم بارك.";
  }else if(pct>=85){tt="يوم قوي — STRONG DAY";cl="#4ade80";
    sb="Almost perfect. ﴿وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ﴾ (3:133) — Close the gap tomorrow.";
  }else if(pct>=65){tt="مقبول لكن غير كافي — NOT ENOUGH";cl="#fbbf24";
    if(mp>0)sb="You missed "+mp+" salah. ﴿إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنكَرِ﴾ (29:45) — Salah protects everything else. Fix this first.";
    else if(dj)sb="Zero work blocks today. You're here to BUILD, not vacation. Block 1 starts at 9:30. Door closed. No excuses.";
    else if(aj)sb="You said you'd refuse the junk. You didn't. 95kg → 80kg starts with one \"لا\" today.";
    else if(wo)sb="Workout skipped. Swim, gym, or walk — doesn't matter, just show up. 95kg doesn't drop by skipping.";
    else sb="Partial effort. Being at home is comfortable. Comfortable doesn't get you to BCG.";
  }else if(pct>=40){tt="يوم ضعيف — WEAK DAY";cl="#f87171";
    if(rl)sb="﴿لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ﴾ (39:53) — Make wudu. Pray tawbah. Read Help tab.";
    else if(mp>=3)sb=mp+" salawat missed. Being home isn't a reason — being home means the mosque is closer.";
    else if(dj)sb="No work, no workout, no plan executed. You're not on vacation. Wasting one week is wasting 25% of your timeline.";
    else sb="Most of the day wasted. Phone? Family hangout? Write what went wrong in notes.";
  }else{tt="لم تحضر اليوم — YOU DIDN'T SHOW UP";cl="#f87171";
    sb="This is the old Abdelali — eats whatever, naps, scrolls. You started this reset for a reason. Your family is counting on you. NOW. Check one box.";
  }
  let h='<div class="vt" style="color:'+cl+'">'+tt+'</div><div class="vs">'+sb+'</div>';
  const co=[];
  if(ck["fajr"]&&ck["quran"])co.push({t:"﴿إِنَّ قُرْآنَ الْفَجْرِ كَانَ مَشْهُودًا﴾ (17:78) — Fajr + Quran done. Allah saw you.",c:"#818cf8"});
  if(ck["workout"])co.push({t:"Workout done. Body is changing. Stack a daily walk on top for fastest fat loss.",c:"#38bdf8"});
  if(ck["daily_walk"])co.push({t:"Daily walk done. Stacks on mosque walks + workout. This is the hidden lever for fat loss.",c:"#4ade80"});
  if(ck["refuse_junk"])co.push({t:"You said \"no\" to the junk. This is the single biggest fat-loss action of the day.",c:"#4ade80"});
  if(ck["no_pmo"]&&sk.cur>=3)co.push({t:sk.cur+" days clean. Every day clean is a day Allah saw you choose Him.",c:"#818cf8"});
  if(ck["no_pmo"]&&sk.cur>=7)co.push({t:"One week+ clean. ﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾ (2:286) — You CAN bear this.",c:"#4ade80"});
  if(napFail)co.push({t:"You woke for Fajr but the nap slid past 8:00. Block 1 lost time. One more slide and switch to no-nap.",c:"#f87171"});
  if(ck["nap_end"]&&ck["wake_fajr"])co.push({t:"Fajr + nap ended on time. The split-sleep plan only works because you held the line at 8:00.",c:"#4ade80"});
  if(pb)co.push({t:"Phone went to bathroom. #1 PMO trigger zone. Leave it outside.",c:"#f87171"});
  if(ck["leetcode"])co.push({t:"LeetCode done. One problem closer to passing CodeSignal.",c:"#fbbf24"});
  if(ck["work_am"]&&ck["work_pm"]&&ck["work_eve"])co.push({t:"All 3 work blocks done. ~8 hours of deep work. Keep going.",c:"#fbbf24"});
  if(ck["work_am"]&&ck["work_pm"]&&!ck["work_eve"])co.push({t:"2/3 work blocks done. Evening block exists for a reason — close the loop.",c:"#fbbf24"});
  if(!ck["leetcode"]&&Object.keys(ck).length>5)co.push({t:"No LeetCode today. It's the FIRST thing after breakfast.",c:"#f87171"});
  if(mp>=3)co.push({t:"Multiple salawat missed. Tomorrow: Fajr first, everything else after.",c:"#f87171"});
  if(co.length)h+='<div style="margin-top:10px">'+co.map(c=>'<div class="co" style="color:'+c.c+';background:'+c.c+'0a;border-color:'+c.c+'40">'+c.t+'</div>').join("")+'</div>';
  return h;
}
